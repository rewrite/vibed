<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tab Cloak</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <p id="status" role="status" aria-live="polite"></p>

    <section>
      <h1>This tab</h1>
      <p id="current-empty">Not disguised.</p>
      <form id="current-form" hidden>
        <div class="inline">
          <img id="current-icon" alt="" width="16" height="16" />
          <input id="current-title" type="text" maxlength="180" required autocomplete="off" aria-label="Title" />
        </div>
        <label class="file">Replace icon <input id="current-file" type="file" accept="image/*" /></label>
        <div class="inline">
          <button type="submit">Save</button>
          <button type="button" id="current-remove">Remove</button>
        </div>
      </form>
    </section>

    <section>
      <h1>Clone a URL</h1>
      <form id="clone-form" class="inline">
        <input id="clone-url" type="text" inputmode="url" placeholder="https://en.wikipedia.org" required autocomplete="off" aria-label="URL to clone" />
        <button type="submit" id="clone-go">Fetch</button>
      </form>
      <form id="clone-preview" hidden>
        <div class="inline">
          <img id="clone-icon" alt="" width="16" height="16" />
          <input id="clone-title" type="text" maxlength="180" required autocomplete="off" aria-label="Cloned title" />
        </div>
        <p id="clone-source"></p>
        <label class="file">Replace icon <input id="clone-file" type="file" accept="image/*" /></label>
        <button type="submit">Use on this tab</button>
      </form>
    </section>

    <section>
      <h1>Custom</h1>
      <form id="custom-form">
        <input id="custom-title" type="text" placeholder="Title" maxlength="180" required autocomplete="off" aria-label="Custom title" />
        <label class="file">Icon <input id="custom-file" type="file" accept="image/*" /></label>
        <input id="custom-icon-url" type="text" inputmode="url" placeholder="or icon URL" autocomplete="off" aria-label="Icon URL" />
        <button type="submit">Use on this tab</button>
      </form>
    </section>

    <section>
      <h1>Saved</h1>
      <p id="saved-empty">None yet.</p>
      <ul id="saved"></ul>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
